<div *ngIf="newTask">
  <app-new-task (cancel)="onCancel()" (add)="onAddNewTask($event)"/>
</div>

<section id="tasks">
  <header>
    <h2>{{name}}'s tasks</h2>
    <menu>
      <button (click)="onAddTask()">Add Task</button>
    </menu>
  </header>

  <ul>
    @for (task of selectedUseTask; track task.id) {
      <li>
        <app-task [task]="task" (complete)="onCompleteTask($event)"/>
      </li>
    }
  </ul>
</section>
